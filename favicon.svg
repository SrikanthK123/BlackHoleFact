<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b34700;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Background circle for depth -->
    <circle cx="50" cy="50" r="42" fill="#1a1a1a" />
    <!-- Main Planet Body -->
    <circle cx="50" cy="50" r="40" fill="url(#planetGradient)" />
    <!-- Planet Ring -->
    <ellipse cx="50" cy="50" rx="48" ry="12" fill="none" stroke="#ff8c00" stroke-width="4" transform="rotate(-25 50 50)" stroke-opacity="0.8" />
    <!-- Highlighting -->
    <circle cx="35" cy="35" r="10" fill="white" fill-opacity="0.1" />
</svg>
